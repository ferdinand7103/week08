name: 00 - Infrastructure

on:
  # Only runs when infrastructure or monitoring code changes
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "monitoring/**"
      - ".github/workflows/00-infrastructure.yml"

  # On a pull request we only validate and plan, nothing is changed in Azure
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "monitoring/**"
      - ".github/workflows/00-infrastructure.yml"

  # Manual run: build the environment, only plan, or tear it down after marking
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: apply
        type: choice
        options:
          - apply
          - plan
          - destroy

permissions:
  contents: read

# Never let two Terraform runs touch the same state at the same time
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

env:
  # Terraform reads the Service Principal from these ARM_* variables.
  # They are taken from the same AZURE_CREDENTIALS secret used by azure/login.
  ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}

jobs:

  # =========================================================
  # Terraform: format check, validate, plan and apply
  # =========================================================
  terraform:
    name: Terraform ${{ inputs.action || (github.event_name == 'pull_request' && 'plan') || 'apply' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_ACTION: ${{ inputs.action || (github.event_name == 'pull_request' && 'plan') || 'apply' }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (remote state in Azure Storage)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=week08.terraform.tfstate"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          if [ "$TF_ACTION" = "destroy" ]; then
            terraform plan -destroy -input=false -no-color -out=tfplan
          else
            terraform plan -input=false -no-color -out=tfplan
          fi

      - name: Add plan to job summary
        run: |
          {
            echo "## Terraform plan ($TF_ACTION)"
            echo '```'
            terraform show -no-color tfplan | tail -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: github.event_name != 'pull_request' && env.TF_ACTION != 'plan'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show Terraform outputs
        if: github.event_name != 'pull_request' && env.TF_ACTION == 'apply'
        run: |
          terraform output
          {
            echo "## Terraform outputs"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # Monitoring: Prometheus + Grafana on the AKS cluster
  # =========================================================
  monitoring:
    name: Deploy and validate monitoring
    runs-on: ubuntu-latest

    # Needs the cluster that Terraform just created or updated
    needs:
      - terraform

    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Prometheus community Helm repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Install or upgrade kube-prometheus-stack
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values monitoring/values.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --wait \
            --timeout 15m

      - name: Apply ServiceMonitor for the KoalaTech services
        run: |
          kubectl apply -f monitoring/servicemonitor.yaml

      - name: Load the KoalaTech Grafana dashboard
        run: |
          kubectl create configmap koalatech-dashboard \
            --namespace monitoring \
            --from-file=monitoring/dashboards/koalatech-dashboard.json \
            --dry-run=client \
            -o yaml \
            | kubectl label -f - --local grafana_dashboard=1 -o yaml \
            | kubectl apply -f -

      - name: Wait for monitoring pods
        run: |
          kubectl wait pods --all \
            --namespace monitoring \
            --for=condition=Ready \
            --timeout=300s
          kubectl get pods,svc -n monitoring

      - name: Validate Prometheus is collecting metrics
        run: |
          kubectl port-forward -n monitoring svc/prometheus-operated 9090:9090 > /dev/null 2>&1 &
          sleep 8

          curl --fail --silent http://localhost:9090/-/ready
          echo

          # Give Prometheus a little time to finish the first scrapes
          for i in {1..12}; do
            UP=$(curl -s http://localhost:9090/api/v1/query \
              --data-urlencode 'query=count(up == 1)' \
              | jq -r '.data.result[0].value[1] // "0"')
            if [ "$UP" -gt 0 ]; then break; fi
            echo "Waiting for scrape targets..."
            sleep 10
          done

          echo "Healthy scrape targets: $UP"

          curl -s http://localhost:9090/api/v1/query \
            --data-urlencode 'query=count by (job) (up == 1)' \
            | jq -r '.data.result[] | "\(.metric.job): \(.value[1])"' | tee targets.txt

          {
            echo "## Prometheus"
            echo "Healthy scrape targets: **$UP**"
            echo '```'
            cat targets.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$UP" -gt 0 ]

      - name: Validate Grafana and the dashboard
        run: |
          GRAFANA_SVC=$(kubectl get svc -n monitoring -l app.kubernetes.io/name=grafana -o name | head -1)
          kubectl port-forward -n monitoring "$GRAFANA_SVC" 3000:80 > /dev/null 2>&1 &
          sleep 8

          curl --fail --silent http://localhost:3000/api/health
          echo

          # The dashboard sidecar can take a few seconds to load the ConfigMap
          for i in {1..12}; do
            FOUND=$(curl -s -u "admin:${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
              "http://localhost:3000/api/search?query=KoalaTech" | jq 'length')
            if [ "$FOUND" -gt 0 ]; then break; fi
            echo "Waiting for dashboard to load..."
            sleep 10
          done

          echo "KoalaTech dashboards found: $FOUND"
          echo "Grafana is healthy, KoalaTech dashboards found: **$FOUND**" >> "$GITHUB_STEP_SUMMARY"

          [ "$FOUND" -gt 0 ]
